name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare trusted-config test root
        # readTrustedConfigJson rejects files under ancestors with extended ACLs or group/other
        # write access. On GitHub-hosted runners /home carries an extended ACL and /tmp is 1777,
        # so give the tests a root-owned-ancestor directory. The tests re-check it with the
        # product rules; this does not relax any check.
        run: |
          sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" /srv/servicenow-mcp-trusted-tests
          getfacl -c -n -p / /srv /srv/servicenow-mcp-trusted-tests
          echo "SN_MCP_TRUSTED_TEST_ROOT=/srv/servicenow-mcp-trusted-tests" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare trusted-config test root
        # readTrustedConfigJson rejects files under ancestors with extended ACLs or group/other
        # write access. On GitHub-hosted runners /home carries an extended ACL and /tmp is 1777,
        # so give the tests a root-owned-ancestor directory. The tests re-check it with the
        # product rules; this does not relax any check.
        run: |
          sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" /srv/servicenow-mcp-trusted-tests
          getfacl -c -n -p / /srv /srv/servicenow-mcp-trusted-tests
          echo "SN_MCP_TRUSTED_TEST_ROOT=/srv/servicenow-mcp-trusted-tests" >> "$GITHUB_ENV"

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 14
